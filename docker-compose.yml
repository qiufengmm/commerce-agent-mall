# =============================================================================
# Mall 本地全栈 Docker Compose 配置
# =============================================================================
# 运行模式：
#   infra（默认分组，不需要 --profile） docker compose up -d
#   + Java 应用                        docker compose --profile app up -d
#   + Nginx 边缘代理                   docker compose --profile edge up -d
#   + Logstash / Kibana                docker compose --profile observability up -d
#   全栈                               docker compose --profile app --profile edge --profile observability up -d
#
# 约定：
# 1. 只使用命名 volume，不使用 /mydata/... 这类宿主机绝对路径。
# 2. 不设置 container_name，不使用 links / external_links。
# 3. 所有凭据来自 .env，仓库内只有 .env.example 的占位符。
# 4. 不修改业务数据库表结构与现有 API，应用连接信息全部通过环境变量覆盖。
# 5. 镜像标签统一支持通过环境变量覆盖，便于在受限网络中替换。
# 6. 默认所有发布端口只绑定 127.0.0.1，不暴露到局域网。
#    只有 MinIO 与 Nginx 提供按服务 opt-in 的绑定地址变量
#    （MINIO_BIND_ADDR / NGINX_BIND_ADDR），用于手机 / 微信开发者工具联调；
#    不存在能把 Redis、MongoDB、ES 等无认证基础设施整体暴露到 0.0.0.0 的开关。
# 7. 启动前必须先执行凭据校验脚本：document/docker/check-env.ps1
# 8. 启动顺序：minio-init 是 bucket 与匿名只读策略的唯一负责方，
#    mall-admin 通过 depends_on 等待其「成功退出」（service_completed_successfully）；
#    minio-init 失败会阻止 mall-admin 启动。
#
# 详细启动与排查步骤见 document/docker/local-startup.md
# =============================================================================

name: mall-local

services:

  # ---------------------------------------------------------------------------
  # infra：MySQL（默认启动）
  # ---------------------------------------------------------------------------
  mysql:
    image: ${MYSQL_IMAGE:-mysql:5.7}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mall}
      TZ: Asia/Shanghai
    # 默认只绑定回环地址
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据库初始化 SQL 默认不挂载：mall.sql 含 DROP TABLE / CREATE TABLE /
      # 初始化数据，只在「新建的空数据卷」首次启动时才会自动执行，误用会丢数据。
      # 确认要初始化一个全新的本地库时，才取消下面一行的注释：
      # - ./mall-master/document/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 注意：Compose 中引用容器环境变量需要写成 $$VAR，否则会在 config 阶段被本地插值
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" -e \"SELECT 1\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - mall-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # infra：Redis（默认启动）
  # ---------------------------------------------------------------------------
  # 本地开发无认证，因此只绑定 127.0.0.1，不允许通过变量整体暴露到局域网。
  redis:
    image: ${REDIS_IMAGE:-redis:7}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      # 保留 mall-net 供其它服务使用，另加入 agent-backend-net 供 Agent 只读会话存取。
      - mall-net
      - agent-backend-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # infra：RabbitMQ（默认启动）
  # ---------------------------------------------------------------------------
  # RABBITMQ_DEFAULT_* 由官方镜像自动创建 vhost、用户并授予权限，
  # 不需要额外的 init 容器执行 rabbitmqctl。
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?请设置 RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请设置 RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/mall}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mall-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # infra：MongoDB（默认启动，mall-portal 浏览历史 / 收藏 / 关注）
  # ---------------------------------------------------------------------------
  # 本地开发无认证，因此只绑定 127.0.0.1。
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mall-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # infra：Elasticsearch 单节点（默认启动）
  # ---------------------------------------------------------------------------
  # 版本 8.18.8，与本地 Maven 依赖 co.elastic.clients:elasticsearch-java:8.18.8
  # 对齐；不使用历史配置中的 7.17.3。
  # 本地开发关闭 xpack 安全认证，因此只绑定 127.0.0.1。
  elasticsearch:
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.18.8}
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      TZ: Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - mall-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # infra：MinIO（默认启动）
  # ---------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # MINIO_BIND_ADDR 是唯一允许改成 0.0.0.0 的按服务 opt-in 变量，
      # 仅在需要手机 / 微信开发者工具联调时使用；默认 127.0.0.1。
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mall-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # infra：MinIO bucket 初始化（一次性任务）
  # ---------------------------------------------------------------------------
  # 只创建 bucket 并设置为「匿名只读下载」（mc anonymous set download），
  # 不开放匿名上传 / 删除 / 写入权限（不使用 upload、public）。
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-05-21T01-59-54Z}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set mallminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null
        mc mb --ignore-existing "mallminio/$$MINIO_BUCKET_NAME"
        # 设置为匿名只读下载（等价于只允许 s3:GetObject），
        # 不开放匿名写入，上传与删除仍需要 root 凭据。
        mc anonymous set download "mallminio/$$MINIO_BUCKET_NAME" > /dev/null
        echo "MinIO bucket ready (anonymous download only): $$MINIO_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-mall}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mall-net
    restart: "no"

  # ===========================================================================
  # app profile：Java 应用（使用本地源码多阶段构建）
  # ===========================================================================
  # mall-search 监听 8081；mall-admin（8080）与 mall-portal（8085）都依赖
  # mall-search 健康后才启动，且不反向依赖，因此不存在循环依赖。
  # mall-admin 额外依赖 minio-init 成功退出（service_completed_successfully）：
  # minio-init 只依赖 minio，minio 不依赖任何服务，因此新增该边不会形成环。
  mall-admin:
    profiles: ["app"]
    image: ${APP_IMAGE_PREFIX:-mall-local}/mall-admin:local
    build:
      context: .
      dockerfile: document/docker/Dockerfile.app
      args:
        MODULE: mall-admin
        JAR_FILE: mall-admin-1.0-SNAPSHOT.jar
        APP_PORT: "8080"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      # 显式声明监听端口，避免依赖模块默认配置
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      SPRING_DATASOURCE_DRUID_MAX_WAIT: "10000"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESSKEY: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      MINIO_SECRETKEY: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKETNAME: ${MINIO_BUCKET_NAME:-mall}
      # 浏览器 / 手机可访问的公开地址，仅用于拼接返回给前端的 URL，
      # 不作为 SDK 连接地址（SDK 仍使用上面的 MINIO_ENDPOINT）。
      # 必须填写可被浏览器解析的地址，不要写成 Docker 服务名 http://minio:9000。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MALL_SEARCH_BASE_URL: http://mall-search:8081
      MALL_SEARCH_INTERNAL_TOKEN: ${MALL_SEARCH_INTERNAL_TOKEN:?请设置 MALL_SEARCH_INTERNAL_TOKEN}
      LOGSTASH_HOST: ${LOGSTASH_HOST:-logstash}
      LOGSTASH_ENABLEINNERLOG: ${LOGSTASH_ENABLEINNERLOG:-false}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    depends_on:
      mall-search:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio 健康只代表 MinIO 服务可连通（SDK 需要能连上）；
      # 上层的 minio-init 才是 bucket 与匿名只读策略的负责方，
      # 因此这里必须等到 minio-init 「成功退出」后才允许应用启动：
      # 若 minio-init 失败（退出码非 0），mall-admin 不会被创建，避免
      # 应用在 bucket 不存在或匿名只读策略未生效时接受上传。
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - mall-net
    restart: unless-stopped

  mall-search:
    profiles: ["app"]
    image: ${APP_IMAGE_PREFIX:-mall-local}/mall-search:local
    build:
      context: .
      dockerfile: document/docker/Dockerfile.app
      args:
        MODULE: mall-search
        JAR_FILE: mall-search-1.0-SNAPSHOT.jar
        APP_PORT: "8081"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      SPRING_DATASOURCE_DRUID_MAX_WAIT: "10000"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # application-dev.yml 中的字面值会被这里的环境变量覆盖（环境变量优先级最高）
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_ELASTICSEARCH_REPOSITORIES_ENABLED: "true"
      MALL_SEARCH_INTERNAL_TOKEN: ${MALL_SEARCH_INTERNAL_TOKEN:?请设置 MALL_SEARCH_INTERNAL_TOKEN}
      MALL_SEARCH_IMPORT_LOCK_ENABLED: ${MALL_SEARCH_IMPORT_LOCK_ENABLED:-true}
      MALL_SEARCH_IMPORT_LOCK_KEY: ${MALL_SEARCH_IMPORT_LOCK_KEY:-mall:search:import-all}
      MALL_SEARCH_IMPORT_LOCK_LEASE_SECONDS: ${MALL_SEARCH_IMPORT_LOCK_LEASE_SECONDS:-1800}
      MALL_SEARCH_IMPORT_LOCK_RENEW_INTERVAL_SECONDS: ${MALL_SEARCH_IMPORT_LOCK_RENEW_INTERVAL_SECONDS:-30}
      LOGSTASH_HOST: ${LOGSTASH_HOST:-logstash}
      LOGSTASH_ENABLEINNERLOG: ${LOGSTASH_ENABLEINNERLOG:-false}
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - mall-net
    restart: unless-stopped

  mall-portal:
    profiles: ["app"]
    image: ${APP_IMAGE_PREFIX:-mall-local}/mall-portal:local
    build:
      context: .
      dockerfile: document/docker/Dockerfile.app
      args:
        MODULE: mall-portal
        JAR_FILE: mall-portal-1.0-SNAPSHOT.jar
        APP_PORT: "8085"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      # mall-portal/src/main/resources/application.yml 未声明 server.port，
      # 且本工作树不含 application-dev.yml，因此必须显式声明 8085
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      SPRING_DATASOURCE_DRUID_MAX_WAIT: "10000"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_PORT: "27017"
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_DATABASE:-mall-port}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/mall}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?请设置 RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请设置 RABBITMQ_PASSWORD}
      # 门户只调用 /esProduct/search，不需要内部同步令牌
      MALL_SEARCH_BASE_URL: http://mall-search:8081
      # 搜索服务调用失败时是否降级到MySQL查询，默认 false（关闭）。
      # 关闭时搜索服务异常原样暴露给调用方；开启后才允许复用MySQL商品读查询，
      # 该降级不具备ES相关度排序能力。
      MALL_SEARCH_MYSQL_FALLBACK_ENABLED: ${MALL_SEARCH_MYSQL_FALLBACK_ENABLED:-false}
      LOGSTASH_HOST: ${LOGSTASH_HOST:-logstash}
      LOGSTASH_ENABLEINNERLOG: ${LOGSTASH_ENABLEINNERLOG:-false}
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8085}:8085"
    depends_on:
      mall-search:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      # 保留 mall-net 供其它服务使用，另加入 agent-backend-net 供 Agent 只读调用 /product/search。
      - mall-net
      - agent-backend-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # app profile：商品导购智能体（Java 17 / mall-agent，只读）
  # ---------------------------------------------------------------------------
  # 运行实现是 mall-master/mall-agent（Spring Boot，Java 17），由 Dockerfile.app 构建；
  # 旧 Python 实现（mall-shopping-agent/ 目录与其独立 Dockerfile.agent）已退役删除，Compose 不再构建它。
  # 只通过 HTTP 调用 mall-portal 的五个只读接口，不直连 MySQL / MongoDB /
  # RabbitMQ / Elasticsearch，也不执行任何 SQL；会话与限流状态放在 Redis。
  # 安全约定：
  #   1. 不挂载根 .env，只注入 MALL_AGENT_* 白名单变量，
  #      避免把基础设施凭据带进 agent 容器；
  #   2. 模型凭据只来自 .env，占位值会被服务端与环境校验脚本拒绝；
  #   3. 宿主机端口默认只绑定 127.0.0.1；
  #   4. 网络分段：只接入 agent-proxy-net（Nginx 可达）与 agent-backend-net
  #      （Redis / mall-portal 可达），不接入共享 mall-net。注意这只是按服务名 / DNS 的
  #      分段，不构成「看不到数据库」的强隔离：Docker Desktop 下主栈服务经宿主机已发布
  #      端口（ES / MongoDB / MySQL）仍可达，共享的无认证 Redis 也仍然可达；
  #   5. 只信任固定对端 Nginx（MALL_AGENT_TRUSTED_PROXY_IP，与 Nginx 静态地址逐字一致）；
  #   6. 只有本服务以固定非 root UID/GID 运行（user: 10001:10001）。
  mall-shopping-agent:
    profiles: ["app"]
    image: ${AGENT_IMAGE:-mall-local/mall-shopping-agent:local}
    # 仅本服务以非 root 运行：Dockerfile.app 的运行身份由 ARG APP_RUN_USER 选择，
    # 这里显式传入 mallapp（UID:GID 10001:10001），使 Agent 镜像 Config.User=mallapp；
    # 进程 HOME 同样由 ARG APP_HOME 选择，这里传入 /app，与 mallapp 的 passwd home 一致。
    # 复用同一 Dockerfile.app 的其它服务不传这两个参数，保持镜像默认 root 与 HOME=/root。
    # 运行镜像不依赖写入 /app，健康探针与只读业务均不需要 root 权限。
    user: "10001:10001"
    build:
      # 使用仓库根作为构建上下文，复用 Java 多阶段构建模板编译 mall-agent 模块。
      # 旧 Python 独立构建路径（./mall-shopping-agent + Dockerfile.agent）已退役删除；
      # 如需回滚，走 Git 层：对已合并 main 的退役提交执行 git revert，不在此恢复 Python 构建上下文。
      context: .
      dockerfile: document/docker/Dockerfile.app
      args:
        MODULE: mall-agent
        JAR_FILE: mall-agent-1.0-SNAPSHOT.jar
        APP_PORT: "8086"
        # 选择运行时用户：只有 Agent 传入 mallapp 以非 root 运行；默认 root 供其它服务使用。
        APP_RUN_USER: mallapp
        # 选择进程 HOME：只有 Agent 传入 /app，与 mallapp 的 passwd home 一致；
        # 三个复用同一 Dockerfile.app 的服务不传，保持基础镜像默认的 /root。
        APP_HOME: /app
    environment:
      TZ: Asia/Shanghai
      # 与 AgentProperties.ENVIRONMENT_VARIABLES 一一对应的 23 个白名单变量。
      # 只注入白名单变量，不整体 env_file，避免把数据库/中间件凭据带进 agent 容器。
      # 配置契约（与 .env.example 的 A/B 两段逐项一致，不可漂移）：
      #   A. 宿主可调（7 个）：以 ${VAR:-默认值} 插值，宿主 .env 可覆盖 ——
      #      LOG_LEVEL / CORS_ALLOW_ORIGINS / MODEL_MODE / OPENAI_BASE_URL /
      #      OPENAI_MODEL / OPENAI_API_KEY / SESSION_TTL_SECONDS。
      #   B. Compose 容器固定值（16 个）：直接写死字面量，不读取宿主 .env 覆盖；
      #      安全 / 超时 / 限流参数刻意固定，例如 REQUEST_TIMEOUT_SECONDS 固定 35；
      #      同一服务内门户身份解析最多再占 10 秒（PORTAL_TIMEOUT_SECONDS 固定 10），
      #      Nginx 对 /agent-api/ 的 proxy_read_timeout 为 60 秒，覆盖「身份解析 10 秒
      #      + Agent 请求 35 秒」的服务端总预算，35 秒严格小于该值。
      MALL_AGENT_HOST: "0.0.0.0"
      MALL_AGENT_PORT: "8086"
      MALL_AGENT_LOG_LEVEL: ${MALL_AGENT_LOG_LEVEL:-INFO}
      # 浏览器同源经 Nginx /agent-api/ 访问不需要 CORS；默认留空表示不授权任何跨域来源，
      # 不使用 :-* 通配兜底。需要跨域直连时，在宿主 .env 显式填写精确来源（逗号分隔）。
      MALL_AGENT_CORS_ALLOW_ORIGINS: ${MALL_AGENT_CORS_ALLOW_ORIGINS:-}
      # 唯一可信反向代理地址：只有请求对端与该值按地址字节相等时才采信 X-Real-IP。
      # 固定为 Nginx 在 agent-proxy-net 上的静态地址，不读宿主 .env，避免被覆盖后信任错误对端。
      MALL_AGENT_TRUSTED_PROXY_IP: "172.21.240.2"
      MALL_AGENT_REQUEST_TIMEOUT_SECONDS: "35"
      # openai（默认，需要真实 Key）或 stub（无 Key 离线演示）
      MALL_AGENT_MODEL_MODE: ${MALL_AGENT_MODEL_MODE:-openai}
      MALL_AGENT_OPENAI_BASE_URL: ${MALL_AGENT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      MALL_AGENT_OPENAI_MODEL: ${MALL_AGENT_OPENAI_MODEL:-gpt-4o-mini}
      # 允许为空：为空时聊天接口返回 503，不会让模型凭空回答商品事实
      MALL_AGENT_OPENAI_API_KEY: ${MALL_AGENT_OPENAI_API_KEY:-}
      MALL_AGENT_OPENAI_TIMEOUT_SECONDS: "30"
      MALL_AGENT_MAX_TOOL_ROUNDS: "4"
      # 只读调用 mall-portal，使用容器服务名而不是宿主机地址
      MALL_AGENT_PORTAL_BASE_URL: http://mall-portal:8085
      MALL_AGENT_PORTAL_TIMEOUT_SECONDS: "10"
      MALL_AGENT_REDIS_URL: redis://redis:6379/0
      MALL_AGENT_SESSION_TTL_SECONDS: ${MALL_AGENT_SESSION_TTL_SECONDS:-86400}
      MALL_AGENT_SESSION_MAX_MESSAGES: "20"
      MALL_AGENT_RATE_LIMIT_SESSION_LIMIT: "20"
      MALL_AGENT_RATE_LIMIT_SESSION_WINDOW_SECONDS: "300"
      MALL_AGENT_RATE_LIMIT_IP_LIMIT: "60"
      MALL_AGENT_RATE_LIMIT_IP_WINDOW_SECONDS: "300"
      MALL_AGENT_TOOL_RESULT_MAX_CHARS: "4000"
      MALL_AGENT_CONTEXT_MAX_CHARS: "16000"
    ports:
      - "127.0.0.1:${AGENT_PORT:-8086}:8086"
    depends_on:
      redis:
        condition: service_healthy
      # 只读调用 mall-portal，因此等待其健康后再启动
      mall-portal:
        condition: service_healthy
    healthcheck:
      # Dockerfile.app 运行镜像已通过 apt-get 安装 curl，直接探测存活接口。
      # Compose healthcheck 依然只探 /health/live（进程存活即 200），不探 /health/ready：
      # /health/ready 由 AgentHealthConfiguration 注册的真实探针决定——Redis PING 与
      # mall-portal 只读查询均健康时返回 200，任一失败即 503；把它用作容器探针会在依赖
      # 异常（Redis 或门户短暂不可用）时把容器标为 unhealthy，混淆进程存活与依赖就绪
      # （普通 Compose 的 healthcheck 不会因 unhealthy 自动重启容器），因此存活探针
      # 与就绪语义分开：依赖是否就绪由 /health/ready 单独对外暴露。
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8086/health/live
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      # 只接入专网：经 agent-proxy-net 被 Nginx 反向代理，经 agent-backend-net 访问
      # Redis 与 mall-portal；不接入共享 mall-net。该分段仅按服务名 / DNS 隔离，
      # 不是「看不到数据库」的强隔离：Docker Desktop 下主栈服务经宿主机已发布端口
      # （ES / MongoDB / MySQL）仍可达，共享的无认证 Redis 也仍然可达。
      # agent-proxy-net 上使用固定静态地址，便于用 MALL_AGENT_TRUSTED_PROXY_IP 精确比对 Nginx。
      agent-proxy-net:
        ipv4_address: 172.21.240.3
      agent-backend-net:
    restart: unless-stopped

  # ===========================================================================
  # edge profile：Nginx 边缘代理
  # ===========================================================================
  # 挂载已构建好的前端静态产物，并反向代理四个后端服务：
  #   /admin-api/  -> mall-admin:8080
  #   /portal-api/ -> mall-portal:8085
  #   /es-api/     -> mall-search:8081
  #   /agent-api/  -> mall-shopping-agent:8086
  # 未构建前端产物时目录为空，页面会 404，构建命令见 document/docker/local-startup.md。
  nginx:
    profiles: ["edge"]
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      # NGINX_BIND_ADDR 是另一个允许改成 0.0.0.0 的按服务 opt-in 变量，
      # 仅在需要手机 / 微信开发者工具联调时使用；默认 127.0.0.1。
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_HTTP_PORT:-8088}:80"
    volumes:
      - ./document/docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${ADMIN_WEB_DIST_DIR:-./mall-admin-web-master/dist}:/usr/share/nginx/admin:ro
      - ${H5_WEB_DIST_DIR:-./mall-app-web-master/dist/build/h5}:/usr/share/nginx/h5:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      # 保留 mall-net 继续反向代理商城其它服务；加入 agent-proxy-net 代理 Agent，
      # 并用固定静态地址 172.21.240.2 作为 Agent 唯一可信的代理对端。
      mall-net:
      agent-proxy-net:
        ipv4_address: 172.21.240.2
    restart: unless-stopped

  # ===========================================================================
  # observability profile：Logstash + Kibana
  # ===========================================================================
  # 不作为业务启动依赖，只在需要日志采集 / 检索时按需启动。
  logstash:
    profiles: ["observability"]
    image: ${LOGSTASH_IMAGE:-docker.elastic.co/logstash/logstash:8.18.3}
    environment:
      TZ: Asia/Shanghai
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:4560:4560"
      - "127.0.0.1:4561:4561"
      - "127.0.0.1:4562:4562"
      - "127.0.0.1:4563:4563"
    volumes:
      - ./document/docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/stats > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - mall-net
    restart: unless-stopped

  kibana:
    profiles: ["observability"]
    image: ${KIBANA_IMAGE:-docker.elastic.co/kibana/kibana:8.18.8}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - mall-net
    restart: unless-stopped

# =============================================================================
# 网络与数据卷
# =============================================================================
networks:
  # 共享网络：Nginx 与原有商城服务（含 MySQL/MongoDB/ES 等无认证基础设施）都接在这一层。
  mall-net:
    driver: bridge

  # Agent 专用代理网络：普通 bridge + 固定子网，只接入 Nginx 与 Agent。
  # 固定静态地址让 Agent 能逐字比对可信代理对端：Nginx=172.21.240.2，Agent=172.21.240.3。
  # 该子网 172.21.240.0/29 已只读复核：本机现有网段为 172.17.0.0/16、172.18.0.0/16、
  # 172.19.0.0/16、172.20.0.0/16，与本子网不重叠。
  agent-proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.240.0/29

  # Agent 后端网络：普通 bridge。不能设置 internal=true，
  # 否则 Agent 失去调用外部模型 API 的出网能力；只接入 Agent / Redis / mall-portal。
  agent-backend-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  mongo-data:
  es-data:
  minio-data:
