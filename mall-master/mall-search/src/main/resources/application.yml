spring:
  application:
    name: mall-search
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # Elasticsearch 地址，默认与 Spring Boot 内置默认值一致（localhost:9200），
  # 可通过环境变量 MALL_ES_URIS 覆盖，例如 MALL_ES_URIS=http://127.0.0.1:9200
  # 注意：仓库中不放 ES 账号密码，开启安全认证时请通过环境变量或启动参数注入
  elasticsearch:
    uris: ${MALL_ES_URIS:localhost:9200}

server:
  port: 8081

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

mall:
  search:
    # 内部服务调用令牌，本地启动前需导出环境变量MALL_SEARCH_INTERNAL_TOKEN（mall-admin与mall-search使用同一个值），仓库内不存放真实令牌
    # 鉴权行为：importAll、create/{id}、delete/{id}、delete/batch、sync/{id}、sync/batch
    #          六条写路径统一受X-Internal-Token保护；
    #          服务端未配置令牌时写接口返回503并记录error日志，
    #          请求缺少X-Internal-Token或令牌不匹配返回401；
    #          只读搜索接口(search、search/simple、search/relate、recommend/{id})保持匿名，不需要令牌
    internal-token: ${MALL_SEARCH_INTERNAL_TOKEN:}
    # 单次批量同步商品id数量上限，请求id数量为空或超过该上限时返回400
    # 该值需与mall-admin的mall.search.max-sync-batch-size保持一致
    max-sync-batch-size: 100
    # importAll 的跨实例 Redis 互斥锁。Redis 不可用或锁续租失败时拒绝继续清理陈旧 ES 文档。
    import-lock:
      enabled: ${MALL_SEARCH_IMPORT_LOCK_ENABLED:true}
      key: ${MALL_SEARCH_IMPORT_LOCK_KEY:mall:search:import-all}
      lease-seconds: ${MALL_SEARCH_IMPORT_LOCK_LEASE_SECONDS:1800}
      renew-interval-seconds: ${MALL_SEARCH_IMPORT_LOCK_RENEW_INTERVAL_SECONDS:30}

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-search'
      packages-to-scan: com.macro.mall.search.controller



