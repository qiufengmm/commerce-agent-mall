spring:
  application:
    name: mall-search
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8081

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

mall:
  search:
    # 内部服务调用令牌，本地启动前需导出环境变量MALL_SEARCH_INTERNAL_TOKEN（mall-admin与mall-search使用同一个值），仓库内不存放真实令牌
    # 未配置时同步接口(/esProduct/sync/**)会返回503并记录error日志，不会静默放行
    internal-token: ${MALL_SEARCH_INTERNAL_TOKEN:}
    # 单次批量同步商品id数量上限，超过上限返回400
    max-sync-batch-size: 100

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-search'
      packages-to-scan: com.macro.mall.search.controller



