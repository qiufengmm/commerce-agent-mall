# 本地 Compose 版 Logstash 管道配置
# 来源：mall-master/document/elk/logstash.conf
# 差异：output.elasticsearch.hosts 由 localhost:9200 改为 http://elasticsearch:9200
#       （容器内 localhost 指自身，必须指向 Compose 服务名）
# 端口与 mall-common/logback-spring.xml 中的 LOG_STASH_* appender 一一对应：
#   4560 debug / 4561 error / 4562 business / 4563 record
input {
  tcp {
    mode => "server"
    host => "0.0.0.0"
    port => 4560
    codec => json_lines
    type => "debug"
  }
  tcp {
    mode => "server"
    host => "0.0.0.0"
    port => 4561
    codec => json_lines
    type => "error"
  }
  tcp {
    mode => "server"
    host => "0.0.0.0"
    port => 4562
    codec => json_lines
    type => "business"
  }
  tcp {
    mode => "server"
    host => "0.0.0.0"
    port => 4563
    codec => json_lines
    type => "record"
  }
}
filter{
  if [type] == "record" {
    mutate {
      remove_field => "port"
      remove_field => "host"
      remove_field => "@version"
    }
    json {
      source => "message"
      remove_field => ["message"]
    }
  }
}
output {
  elasticsearch {
    hosts => "http://elasticsearch:9200"
    index => "mall-%{type}-%{+YYYY.MM.dd}"
  }
}
