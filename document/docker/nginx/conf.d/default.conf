# =============================================================================
# Mall 本地 Nginx 站点配置（edge profile）
# =============================================================================
# 挂载路径：/etc/nginx/conf.d/default.conf
# 静态资源：
#   /usr/share/nginx/admin          -> 管理后台构建产物（mall-admin-web-master/dist）
#   /usr/share/nginx/h5             -> H5 构建产物（mall-app-web-master/dist/build/h5）
# 路径映射：
#   /            -> 管理后台
#   /h5/         -> H5 页面入口
#   /static/     -> H5 静态资源（uni-app 运行时按绝对路径请求，需单独映射）
# 反向代理：
#   /admin-api/  -> mall-admin:8080
#   /portal-api/ -> mall-portal:8085
#   /es-api/     -> mall-search:8081
#
# 使用 Docker 内置 DNS（127.0.0.11）做运行时解析，后端服务未启动时
# Nginx 仍可正常启动，对应接口返回 502，而不是整个容器启动失败。
# =============================================================================

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen       80;
    server_name  localhost;
    charset      utf-8;

    client_max_body_size 20m;

    access_log /var/log/nginx/mall-access.log;
    error_log  /var/log/nginx/mall-error.log warn;

    # ------------------------------------------------------------------
    # 管理后台静态站点
    # ------------------------------------------------------------------
    root  /usr/share/nginx/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # H5 / 移动端静态站点
    # ------------------------------------------------------------------
    location /h5/ {
        alias /usr/share/nginx/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # ------------------------------------------------------------------
    # H5 页面内的绝对路径 /static/**
    # ------------------------------------------------------------------
    # uni-app 的 H5 产物在运行时按绝对路径请求静态资源（/static/notice/ad1.jpg），
    # 而页面入口是 /h5/，浏览器不会自动补 /h5 前缀，因此这里单独补一条映射。
    #
    # 为什么不会影响管理后台（已核对构建产物）：
    #   - 管理后台 vite.config.ts 使用 base: './'，index.html 只引用
    #     ./assets/** 与 ./favicon.ico，不使用绝对路径；
    #   - mall-admin-web-master/dist 目录下只有 assets/、tinymce6.8.6/、
    #     favicon.ico、index.html，不存在 static 目录；
    #   - 因此 /static/** 只可能来自 H5，映射到 H5 静态目录不会覆盖后台资源。
    #
    # 注意：这里的 /static/** 是 H5 前端自带的本地静态资源，
    # 与 MinIO 里的商品图片地址（http://<host>:9000/mall/...）不是同一类资源，
    # 不要为 MinIO 图片再增加 /minio/ 反向代理。
    location /static/ {
        alias /usr/share/nginx/h5/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------------
    # 反向代理：mall-admin
    # 管理后台需使用 VITE_BASE_SERVER_URL=/admin-api 构建才能走这里
    # ------------------------------------------------------------------
    location /admin-api/ {
        set $backend_admin "mall-admin:8080";
        rewrite ^/admin-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_admin$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # 反向代理：mall-portal
    # H5 需使用 VITE_API_BASE_URL=/portal-api 构建才能走这里
    # ------------------------------------------------------------------
    location /portal-api/ {
        set $backend_portal "mall-portal:8085";
        rewrite ^/portal-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_portal$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # 反向代理：mall-search
    # 仅用于本地排查索引与同步接口，业务链路不经过这里
    # ------------------------------------------------------------------
    location /es-api/ {
        set $backend_search "mall-search:8081";
        rewrite ^/es-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_search$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
