# =============================================================================
# Mall 本地 Nginx 站点配置（edge profile）
# =============================================================================
# 挂载路径：/etc/nginx/conf.d/default.conf
# 静态资源：
#   /usr/share/nginx/admin          -> 管理后台构建产物（mall-admin-web-master/dist）
#   /usr/share/nginx/h5             -> H5 构建产物（mall-app-web-master/dist/build/h5）
# 路径映射：
#   /            -> 管理后台
#   /h5/         -> H5 页面入口
#   /static/     -> H5 静态资源（uni-app 运行时按绝对路径请求，需单独映射）
# 反向代理：
#   /admin-api/  -> mall-admin:8080
#   /portal-api/ -> mall-portal:8085
#   /es-api/     -> mall-search:8081
#   /agent-api/  -> mall-shopping-agent:8086
#
# 使用 Docker 内置 DNS（127.0.0.11）做运行时解析，后端服务未启动时
# Nginx 仍可正常启动，对应接口返回 502，而不是整个容器启动失败。
# =============================================================================

resolver 127.0.0.11 valid=30s ipv6=off;

# -----------------------------------------------------------------------------
# /agent-api/ 专用访问日志格式（脱敏）
# -----------------------------------------------------------------------------
# 背景：移动端用 GET /agent-api/agent/session/<sessionId> 恢复游客会话，
# sessionId 本身就是会话凭据（Redis 键 mall:agent:session:guest:<sessionId>）。
# 内置 combined 格式会记录完整请求行，使凭据与查询串写入 mall-access.log。
#
# 本格式只保留可诊断字段（时间、请求方法、状态码、字节数、耗时、上游状态），
# 不记录请求行 / URL、查询串、Authorization、Cookie，也不记录客户端 IP
# （$remote_addr 与 X-Real-IP 携带同一客户端地址，一并去除）。
# 只有 /agent-api/ location 引用本格式，其余 location 仍使用内置 combined。
log_format agent_redacted '[time=$time_local] method=$request_method status=$status '
                          'bytes_sent=$body_bytes_sent request_time=$request_time '
                          'upstream_status=$upstream_status '
                          'upstream_response_time=$upstream_response_time';

server {
    listen       80;
    server_name  localhost;
    charset      utf-8;

    client_max_body_size 20m;

    access_log /var/log/nginx/mall-access.log;
    error_log  /var/log/nginx/mall-error.log warn;

    # ------------------------------------------------------------------
    # 管理后台静态站点
    # ------------------------------------------------------------------
    root  /usr/share/nginx/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # H5 / 移动端静态站点
    # ------------------------------------------------------------------
    location /h5/ {
        alias /usr/share/nginx/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # ------------------------------------------------------------------
    # H5 页面内的绝对路径 /static/**
    # ------------------------------------------------------------------
    # uni-app 的 H5 产物在运行时按绝对路径请求静态资源（/static/notice/ad1.jpg），
    # 而页面入口是 /h5/，浏览器不会自动补 /h5 前缀，因此这里单独补一条映射。
    #
    # 为什么不会影响管理后台（已核对构建产物）：
    #   - 管理后台 vite.config.ts 使用 base: './'，index.html 只引用
    #     ./assets/** 与 ./favicon.ico，不使用绝对路径；
    #   - mall-admin-web-master/dist 目录下只有 assets/、tinymce6.8.6/、
    #     favicon.ico、index.html，不存在 static 目录；
    #   - 因此 /static/** 只可能来自 H5，映射到 H5 静态目录不会覆盖后台资源。
    #
    # 注意：这里的 /static/** 是 H5 前端自带的本地静态资源，
    # 与 MinIO 里的商品图片地址（http://<host>:9000/mall/...）不是同一类资源，
    # 不要为 MinIO 图片再增加 /minio/ 反向代理。
    location /static/ {
        alias /usr/share/nginx/h5/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------------
    # 反向代理：mall-admin
    # 管理后台需使用 VITE_BASE_SERVER_URL=/admin-api 构建才能走这里
    # ------------------------------------------------------------------
    location /admin-api/ {
        set $backend_admin "mall-admin:8080";
        rewrite ^/admin-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_admin$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # 反向代理：mall-portal
    # H5 需使用 VITE_API_BASE_URL=/portal-api 构建才能走这里
    # ------------------------------------------------------------------
    location /portal-api/ {
        set $backend_portal "mall-portal:8085";
        rewrite ^/portal-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_portal$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # 反向代理：mall-search
    # 仅用于本地排查 ES 索引与 ES 写接口（写接口需要 X-Internal-Token），业务链路不经过这里
    # ------------------------------------------------------------------
    location /es-api/ {
        set $backend_search "mall-search:8081";
        rewrite ^/es-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_search$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # 反向代理：mall-shopping-agent（商品导购智能体）
    # H5 需使用 VITE_AGENT_API_BASE_URL=/agent-api 构建才能走这里
    # ------------------------------------------------------------------
    # 模型多轮工具调用的服务端总超时为 35 秒，门户身份解析另需 10 秒预算，
    # 因此这里的读超时必须不小于「10s + 35s」的服务端总预算（当前 60s 留有余量），
    # 否则会出现“后端仍在处理但 Nginx 先返回 504”的假失败。
    # Authorization 头不在此处改写或清理，保持移动端保存的完整 Token 透传。
    location /agent-api/ {
        set $backend_agent "mall-shopping-agent:8086";
        rewrite ^/agent-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_agent$uri$is_args$args;

        # 访问日志脱敏：仍写入 server 级同一个日志文件，但改用 agent_redacted 格式，
        # 避免 URL 中的游客会话凭据、查询串、Authorization 与客户端 IP 落盘。
        # 刻意不用 access_log off，保留状态码 / 方法 / 耗时等排障所需诊断。
        access_log /var/log/nginx/mall-access.log agent_redacted;

        # 错误日志隔离：Nginx error_log 的 error details 会记录完整请求 URI，
        # 而 /agent-api/agent/session/<sessionId> 的 URI 携带游客会话凭据。
        # 这里只用 location 级 error_log 把该路由的错误日志丢弃（写 /dev/null），
        # 代价是丢失该路由的 Nginx error details——这是为避免凭据落盘的有意取舍，
        # access_log 仍按上方脱敏格式保留状态 / 方法 / 耗时，排障信息不会全部消失。
        error_log /dev/null;

        # 请求体上限：该路由只需承载 JSON 聊天请求（含最长 1000 Unicode code points
        # 的字符串，最坏 UTF-8 4 字节/码点，32k 有充足余量），故收紧此处上限；
        # 其它 location 仍继承 server 级 20m。
        client_max_body_size 32k;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
